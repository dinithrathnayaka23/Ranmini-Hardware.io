# ---------------------------------------------------------------------------
# Ranmini Hardware POS — service configuration
#
# Nothing secret lives in this file. The Mongo connection string is supplied by
# the environment (see .env.example); it carries credentials and must never be
# committed.
# ---------------------------------------------------------------------------
spring:
  application:
    name: ranmini-pos

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ranmini_pos}
      # Index creation is deliberately OFF. Spring's automatic creation runs on
      # first use of each collection, which on a large collection means a
      # surprise foreground build in the middle of a trading day. Indexes are
      # instead declared in MongoIndexInitializer and created at startup, in
      # the background, where they can be reviewed as code.
      auto-index-creation: false

  # Settings and category lists are read constantly and written rarely.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      # Profile pictures (512KB) and product photographs (1MB). The service
      # checks both limits itself; these are the outer bound that stops an
      # oversized upload being buffered at all rather than being read in full
      # and then refused. Kept above the largest allowed file so a legitimate
      # 1MB photograph is not rejected by the container's own limit once
      # multipart framing is added to it.
      max-file-size: 2MB
      max-request-size: 4MB

  # Outgoing mail, for password-reset links.
  #
  # Note what is NOT here: spring.mail.host. Spring only defines a
  # JavaMailSender when that property exists, and ResetMailer relies on its
  # absence to fall back to logging the link — so setting it here to an empty
  # default would create a sender pointed at nowhere and break the fallback.
  # The host, username and password come straight from the environment
  # (SPRING_MAIL_HOST and friends); see .env.example.
  #
  # Only the timeouts are pinned, because they are wrong by default: the JavaMail
  # defaults are infinite, so one unreachable relay would pin a request thread
  # until the client gave up.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  threads:
    virtual:
      # Java 21 virtual threads. Request handling here is dominated by waiting
      # on Mongo, which is exactly the workload they are for.
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never leak stack traces or internal paths to an API client.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. Metrics and env are useful but are not for the public
        # internet without authentication, which is a later phase.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Application-specific settings, bound by typed @ConfigurationProperties rather
# than scattered @Value annotations.
ranmini:
  api:
    # Hard ceiling on any page size a client can ask for. Without it, one
    # `?size=1000000` turns a paged endpoint into a full collection scan.
    max-page-size: 200
    default-page-size: 25
  cors:
    # The Next.js frontend during development. Production origins are supplied
    # by the environment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  auth:
    # Signing key for session tokens. No default on purpose: the service refuses
    # to start without one rather than inventing a key, which would invalidate
    # every session on restart and accept tokens signed by a key nobody chose.
    jwt-secret: ${RANMINI_AUTH_JWT_SECRET:}
    # Short-lived, because a signed token cannot be revoked before it expires.
    access-token-minutes: ${RANMINI_AUTH_ACCESS_MINUTES:30}
    refresh-token-days: ${RANMINI_AUTH_REFRESH_DAYS:7}

    # How long a "forgot password" link stays good. Long enough to survive a
    # slow mail relay and somebody reading their email after lunch; short
    # enough that a link left in an inbox stops being a key to the account.
    reset-token-minutes: ${RANMINI_AUTH_RESET_MINUTES:45}

    # Ceiling on password-reset requests, counted per email address and per
    # caller address. Stops the endpoint being used to flood a member of staff
    # with mail, or to get the shop's sending domain blacklisted.
    reset-rate-limit:
      attempts: ${RANMINI_AUTH_RESET_ATTEMPTS:5}
      window-minutes: ${RANMINI_AUTH_RESET_WINDOW_MINUTES:15}

  app:
    # Where the reset link points. Must be the address the shop's browsers
    # actually use, since it is the frontend that renders the reset form.
    reset-url: ${RANMINI_RESET_URL:http://localhost:3000/admin/reset-password}

  mail:
    from: ${RANMINI_MAIL_FROM:no-reply@ranminihardware.lk}
    shop-name: ${RANMINI_MAIL_SHOP_NAME:Ranmini Hardware}

  # The two owner accounts, created on a fresh database only. Passwords come
  # from the environment; leave them unset and a strong one is generated and
  # logged once at first startup.
  admin:
    primary:
      username: ${RANMINI_ADMIN_PRIMARY_USERNAME:owner}
      name: ${RANMINI_ADMIN_PRIMARY_NAME:Shop Owner}
      email: ${RANMINI_ADMIN_PRIMARY_EMAIL:owner@ranminihardware.lk}
      password: ${RANMINI_ADMIN_PRIMARY_PASSWORD:}
    secondary:
      username: ${RANMINI_ADMIN_SECONDARY_USERNAME:manager}
      name: ${RANMINI_ADMIN_SECONDARY_NAME:Assistant Owner}
      email: ${RANMINI_ADMIN_SECONDARY_EMAIL:manager@ranminihardware.lk}
      password: ${RANMINI_ADMIN_SECONDARY_PASSWORD:}

logging:
  level:
    lk.ranminihardware.pos: ${APP_LOG_LEVEL:INFO}
